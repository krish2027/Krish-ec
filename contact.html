<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novax. — Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { background-color: #0b0d13; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
    .hear-gradient-text { background: linear-gradient(135deg, #a770ef 0%, #cf8bf3 40%, #70a6ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .glass-card { background: rgba(18, 22, 32, 0.72); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7); }
    .form-input { background: #0f131c; border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; outline: none; transition: all 0.2s ease; }
    .form-input:focus { border-color: rgba(124, 77, 255, 0.6); box-shadow: 0 0 14px rgba(124, 77, 255, 0.25); }
    .btn-send { background: linear-gradient(90deg, #6c47ff 0%, #5867fe 100%); box-shadow: 0 8px 24px -4px rgba(108, 71, 255, 0.5); transition: all 0.2s ease; }
    .btn-send:hover { background: linear-gradient(90deg, #7c58ff 0%, #6b77fe 100%); transform: translateY(-1px); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white relative">
  <header class="w-full max-w-7xl mx-auto px-6 sm:px-8 pt-8 pb-4 flex items-center justify-between z-20">
    <a href="index.html" class="text-2xl font-extrabold tracking-tight">Novax<span class="text-purple-500">.</span></a>
    <nav class="hidden md:flex items-center space-x-10 text-sm font-medium text-gray-300">
      <a href="index.html" class="hover:text-purple-400 transition">Home</a>
      <a href="shop.html" class="hover:text-purple-400 transition">Shop</a>
      <a href="about.html" class="hover:text-purple-400 transition">About</a>
      <a href="contact.html" class="text-purple-400 font-semibold">Contact</a>
    </nav>
    <div class="flex items-center space-x-4 sm:space-x-6">
      <a href="cart.html" class="relative text-gray-300 hover:text-white transition p-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span id="cart-counter" class="absolute top-1 right-0 transform translate-x-1 -translate-y-1 bg-purple-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center ring-2 ring-[#0b0d13]">
          0
        </span>
      </a>
      <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white p-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="mobile-nav" class="hidden md:hidden glass-card mx-6 rounded-2xl p-5 space-y-4 text-center text-sm z-30">
    <a href="index.html" class="block text-gray-300 hover:text-white">Home</a>
    <a href="shop.html" class="block text-gray-300 hover:text-white">Shop</a>
    <a href="about.html" class="block text-gray-300 hover:text-white">About</a>
    <a href="contact.html" class="block text-purple-400 font-semibold">Contact</a>
  </nav>

  <main class="flex-1 w-full max-w-7xl mx-auto px-6 sm:px-8 py-10 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-20">
    <div class="lg:col-span-6 space-y-8">
      <div class="space-y-4">
        <div class="inline-block px-3.5 py-1 rounded-full text-xs font-semibold tracking-wide text-gray-300 bg-white/5 border border-white/10">
          Contact Us
        </div>
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-[1.1]">
          We'd Love to <br />
          <span class="hear-gradient-text">Hear From You</span>
        </h1>
        <p class="text-gray-400 text-base leading-relaxed max-w-md">
          Have inquiries about bulk orders or support? Reach out directly.
        </p>
      </div>

      <div class="space-y-4">
        <div class="flex items-center space-x-4">
          <div class="w-11 h-11 rounded-xl bg-[#131724] border border-white/10 flex items-center justify-center text-purple-400 shrink-0">✉</div>
          <div>
            <p class="text-xs text-gray-400 font-medium">Email</p>
            <p class="text-sm font-semibold text-white">support@novax.com</p>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="w-11 h-11 rounded-xl bg-[#131724] border border-white/10 flex items-center justify-center text-purple-400 shrink-0">☎</div>
          <div>
            <p class="text-xs text-gray-400 font-medium">Phone</p>
            <p class="text-sm font-semibold text-white">+1 234 567 8900</p>
          </div>
        </div>
      </div>
    </div>

    <div class="lg:col-span-6 relative">
      <div class="glass-card rounded-3xl p-6 sm:p-8 space-y-5 relative z-10">
        <form id="contact-form" class="space-y-4">
          <input type="text" required placeholder="Your Name" class="form-input w-full px-5 py-3.5 rounded-xl text-sm" />
          <input type="email" required placeholder="Your Email" class="form-input w-full px-5 py-3.5 rounded-xl text-sm" />
          <input type="text" required placeholder="Subject" class="form-input w-full px-5 py-3.5 rounded-xl text-sm" />
          <textarea rows="4" required placeholder="Your Message" class="form-input w-full px-5 py-3.5 rounded-xl text-sm resize-none"></textarea>
          <button type="submit" class="btn-send w-full py-4 rounded-xl text-sm font-semibold text-white tracking-wide">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </main>

  <div class="w-full h-44 relative z-10 pointer-events-none overflow-hidden mt-auto">
    <canvas id="particle-wave-canvas" class="w-full h-full block"></canvas>
  </div>

  <script>
    let waveScene, waveCamera, waveRenderer, waveParticles;
    const SEPARATION = 45, AMOUNTX = 60, AMOUNTY = 30;
    let count = 0;

    function initWave() {
      const canvas = document.getElementById('particle-wave-canvas');
      const w = canvas.clientWidth || 300;
      const h = canvas.clientHeight || 150;

      waveScene = new THREE.Scene();
      waveCamera = new THREE.PerspectiveCamera(55, w / h, 1, 10000);
      waveCamera.position.set(0, 350, 1000);
      waveCamera.lookAt(0, 0, 0);

      waveRenderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      waveRenderer.setSize(w, h);

      const numParticles = AMOUNTX * AMOUNTY;
      const positions = new Float32Array(numParticles * 3);
      const colors = new Float32Array(numParticles * 3);
      const colPurple = new THREE.Color(0x8a4bff);
      const colBlue = new THREE.Color(0x38bdf8);

      let i = 0;
      for (let ix = 0; ix < AMOUNTX; ix++) {
        for (let iy = 0; iy < AMOUNTY; iy++) {
          positions[i] = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
          positions[i + 1] = 0;
          positions[i + 2] = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);

          const c = colPurple.clone().lerp(colBlue, (ix / AMOUNTX));
          colors[i] = c.r;
          colors[i + 1] = c.g;
          colors[i + 2] = c.b;
          i += 3;
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({ size: 6, vertexColors: true, transparent: true, opacity: 0.8 });
      waveParticles = new THREE.Points(geometry, material);
      waveScene.add(waveParticles);

      window.addEventListener('resize', () => {
        if (!canvas || !waveRenderer || !waveCamera) return;
        waveCamera.aspect = canvas.clientWidth / canvas.clientHeight;
        waveCamera.updateProjectionMatrix();
        waveRenderer.setSize(canvas.clientWidth, canvas.clientHeight);
      });
    }

    function animateWave() {
      requestAnimationFrame(animateWave);
      if (waveParticles) {
        const positions = waveParticles.geometry.attributes.position.array;
        let i = 0;
        for (let ix = 0; ix < AMOUNTX; ix++) {
          for (let iy = 0; iy < AMOUNTY; iy++) {
            positions[i + 1] = (Math.sin((ix + count) * 0.25) * 40) + (Math.sin((iy + count) * 0.4) * 40);
            i += 3;
          }
        }
        waveParticles.geometry.attributes.position.needsUpdate = true;
        waveRenderer.render(waveScene, waveCamera);
        count += 0.04;
      }
    }

    window.addEventListener('load', () => {
      initWave();
      animateWave();
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
